<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>beatmania IIDX ☆12 難易度表</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8;
    --fg: #1c1e21;
    --muted: #6b7280;
    --card-bg: #ffffff;
    --card-border: #e2e4e8;
    --section-bg: #eceef1;
    --accent: #2563eb;
    --accent-fg: #ffffff;
    --badge-another: #d64545;
    --badge-hyper: #d99a2b;
    --badge-leggendaria: #8b3fd6;
    --tab-inactive-bg: #e5e7eb;
    --tab-inactive-fg: #374151;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --fg: #e6e8eb;
      --muted: #9aa1ab;
      --card-bg: #24262b;
      --card-border: #34363c;
      --section-bg: #1d1f24;
      --accent: #3b82f6;
      --accent-fg: #0b0d10;
      --badge-another: #e06565;
      --badge-hyper: #e0ac4f;
      --badge-leggendaria: #a875e0;
      --tab-inactive-bg: #2a2d33;
      --tab-inactive-fg: #c3c7cd;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Segoe UI", system-ui, sans-serif;
  }
  header.page-header {
    padding: 20px 24px 12px;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 1.4rem;
  }
  .subtitle {
    margin: 0;
    color: var(--muted);
    font-size: 0.85rem;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 20px;
    padding: 0 24px 12px;
  }
  .tabs {
    display: flex;
    gap: 8px;
  }
  .tab-btn {
    border: none;
    border-radius: 999px;
    padding: 8px 18px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    background: var(--tab-inactive-bg);
    color: var(--tab-inactive-fg);
  }
  .tab-btn.active {
    background: var(--accent);
    color: var(--accent-fg);
  }

  .col-control {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .col-buttons {
    display: flex;
    gap: 4px;
  }
  .col-btn {
    border: none;
    border-radius: 6px;
    width: 30px;
    height: 30px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    background: var(--tab-inactive-bg);
    color: var(--tab-inactive-fg);
  }
  .col-btn.active {
    background: var(--accent);
    color: var(--accent-fg);
  }

  .csv-control {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .csv-btn {
    border: none;
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    background: var(--tab-inactive-bg);
    color: var(--tab-inactive-fg);
  }
  .csv-btn:hover {
    filter: brightness(0.95);
  }
  .csv-reset {
    border: none;
    background: none;
    color: var(--muted);
    text-decoration: underline;
    cursor: pointer;
    font-size: 0.8rem;
    padding: 0;
  }
  #csvFileInput {
    display: none;
  }
  #csvStatus {
    font-size: 0.8rem;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 16px;
    padding: 0 24px 14px;
    font-size: 0.75rem;
    color: var(--muted);
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .legend-swatch {
    width: 14px;
    height: 14px;
    border-radius: 4px;
    border: 1px solid var(--card-border);
    flex: none;
  }

  .stats {
    padding: 0 24px 16px;
    color: var(--muted);
    font-size: 0.8rem;
  }

  .board {
    padding: 0 24px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .section {
    background: var(--section-bg);
    border-radius: 10px;
    padding: 10px 12px 12px;
  }
  .section-header {
    font-weight: 700;
    font-size: 0.95rem;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 8px;
  }
  .section-header .count {
    font-weight: 500;
    font-size: 0.75rem;
    color: var(--muted);
  }
  .section-grid {
    display: grid;
    grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr));
    gap: 6px;
  }
  .chip {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 0.78rem;
    line-height: 1.3;
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .chip.has-clear-status {
    border-color: rgba(0, 0, 0, 0.15);
  }
  .chip.unmatched {
    opacity: 0.5;
    border-style: dashed;
  }
  .chip .badge {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    border-radius: 5px;
    font-size: 0.65rem;
    font-weight: 700;
    color: #fff;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.15);
  }
  .badge.another { background: var(--badge-another); }
  .badge.hyper { background: var(--badge-hyper); }
  .badge.leggendaria { background: var(--badge-leggendaria); }
  .chip .title {
    overflow-wrap: anywhere;
  }
</style>
</head>

  <header class="page-header">
    <h1>beatmania IIDX ☆12 難易度表</h1>
    <p class="subtitle">地力 / 個人差 タイル × クリアランプ基準（ノーマル / ハード）で分類</p>

  <div class="controls">

    <div class="col-control">

    <div class="csv-control">

      <span id="csvStatus"></span>
      <button class="csv-reset" id="csvReset" hidden>クリア状況を解除</button>
    </div>
  </div>

  <div class="legend" id="legend"></div>

  <div class="stats" id="stats"></div>

  <div class="board" id="board"></div>

    text = text.replace(/^﻿/, '');
    const rows = [];
    let field = '', row = [], inQuotes = false, fieldStart = true;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; } else { inQuotes = false; }
        } else {
          field += c;
        }
        continue;
      }
      // A field is only treated as quoted when the quote is the very first
      // character of the field. A stray quote elsewhere (e.g. a song title
      // like Anisakis -somatic mutation type"Forza"-) is real IIDX CSV data
      // and must be kept as a literal character, not a quote delimiter.
      if (fieldStart && c === '"') { inQuotes = true; fieldStart = false; continue; }
      if (c === ',') {
        row.push(field); field = ''; fieldStart = true;
      } else if (c === '\r') {
        // ignore, handled by \n
      } else if (c === '\n') {
        row.push(field); rows.push(row); row = []; field = ''; fieldStart = true;
      } else {
        field += c; fieldStart = false;
      }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows.filter(r => r.length > 1 || (r.length === 1 && r[0] !== ''));
  }

  function buildClearMap(csvText) {
    const rows = parseCSV(csvText);
    if (!rows.length) return { map: new Map(), matched: 0 };
    const header = rows[0];
    const titleIdx = header.indexOf('タイトル');
    const colIdx = {};
    for (const diff of Object.keys(DIFF_TO_CSV_PREFIX)) {
      colIdx[diff] = header.indexOf(`${DIFF_TO_CSV_PREFIX[diff]} クリアタイプ`);
    }
    const map = new Map();
    for (let i = 1; i < rows.length; i++) {
      const row = rows[i];
      if (titleIdx < 0 || titleIdx >= row.length) continue;
      const title = row[titleIdx];
      const rec = {};
      for (const diff of Object.keys(colIdx)) {
        const idx = colIdx[diff];
        if (idx >= 0 && idx < row.length) rec[diff] = row[idx];
      }
      map.set(title, rec);
    }
    return { map };
  }

  csvFileInput.addEventListener('change', () => {
    const file = csvFileInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const { map } = buildClearMap(String(reader.result));
      clearMap = map;

      let matched = 0;
      for (const entry of DATA) {
        if (clearMap.has(entry.csv)) matched++;
      }
      csvStatusEl.textContent = `${file.name}（${matched}/${DATA.length} 譜面が一致）`;
      csvResetBtn.hidden = false;
      render(currentMode());
    };
    reader.readAsText(file, 'utf-8');
  });

  csvResetBtn.addEventListener('click', () => {
    clearMap = null;
    csvFileInput.value = '';
    csvStatusEl.textContent = '';
    csvResetBtn.hidden = true;
    render(currentMode());
  });

  function currentMode() {
    const active = document.querySelector('.tab-btn.active');
    return active ? active.dataset.mode : 'nomal';
  }

  function render(mode) {
    const key = mode === 'hard' ? 'hard' : 'nomal';
    const byTier = new Map(TIERS.map(t => [t, []]));
    for (const entry of DATA) {
      const tier = entry[key];
      if (byTier.has(tier)) byTier.get(tier).push(entry);
    }

    boardEl.innerHTML = '';
    boardEl.style.setProperty('--cols', cols);
    for (const tier of TIERS) {
      const list = byTier.get(tier) || [];
      const section = document.createElement('div');
      section.className = 'section';

      const header = document.createElement('div');
      header.className = 'section-header';
      header.innerHTML = `<span>${tier}</span><span class="count">${list.length}</span>`;
      section.appendChild(header);

      const grid = document.createElement('div');
      grid.className = 'section-grid';
      for (const entry of list) {
        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.dataset.title = entry.title;
        chip.dataset.csv = entry.csv;
        chip.dataset.diff = entry.diff;
        chip.innerHTML = `<span class="badge ${entry.diff}">${entry.diffLabel}</span><span class="title">${entry.title}</span>`;

        if (clearMap) {
          const rec = clearMap.get(entry.csv);
          const clearType = rec && rec[entry.diff];
          const style = clearType && CLEAR_STYLE_BY_TYPE.get(clearType);
          if (style) {
            chip.classList.add('has-clear-status');
            chip.style.background = style.bg;
            chip.style.color = style.fg;
            chip.title = style.label;
          } else {
            chip.classList.add('unmatched');
            chip.title = 'CSVに一致するデータが見つかりません';
          }
        }

        grid.appendChild(chip);
      }
      section.appendChild(grid);
      boardEl.appendChild(section);
    }

    statsEl.textContent = `全 ${DATA.length} 譜面`;
  }

  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      tabBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render(btn.dataset.mode);
    });
  });

  render('nomal');
</script>
</body>
</html>
