<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>beatmania IIDX ☆12 難易度表</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8;
    --fg: #1c1e21;
    --muted: #6b7280;
    --card-bg: #ffffff;
    --card-border: #e2e4e8;
    --column-bg: #eceef1;
    --header-bg: #ffffff;
    --accent: #2563eb;
    --accent-fg: #ffffff;
    --badge-another: #d64545;
    --badge-hyper: #d99a2b;
    --badge-leggendaria: #8b3fd6;
    --tab-inactive-bg: #e5e7eb;
    --tab-inactive-fg: #374151;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --fg: #e6e8eb;
      --muted: #9aa1ab;
      --card-bg: #24262b;
      --card-border: #34363c;
      --column-bg: #1d1f24;
      --header-bg: #24262b;
      --accent: #3b82f6;
      --accent-fg: #0b0d10;
      --badge-another: #e06565;
      --badge-hyper: #e0ac4f;
      --badge-leggendaria: #a875e0;
      --tab-inactive-bg: #2a2d33;
      --tab-inactive-fg: #c3c7cd;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Segoe UI", system-ui, sans-serif;
  }
  header.page-header {
    padding: 20px 24px 12px;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 1.4rem;
  }
  .subtitle {
    margin: 0;
    color: var(--muted);
    font-size: 0.85rem;
  }

  .tabs {
    display: flex;
    gap: 8px;
    padding: 0 24px 12px;
  }
  .tab-btn {
    border: none;
    border-radius: 999px;
    padding: 8px 18px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    background: var(--tab-inactive-bg);
    color: var(--tab-inactive-fg);
  }
  .tab-btn.active {
    background: var(--accent);
    color: var(--accent-fg);
  }

  .stats {
    padding: 0 24px 12px;
    color: var(--muted);
    font-size: 0.8rem;
  }

  .board-wrap {
    padding: 0 24px 24px;
    overflow-x: auto;
  }
  .board {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 220px;
    gap: 10px;
    align-items: start;
  }
  .column {
    background: var(--column-bg);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    max-height: calc(100vh - 170px);
    min-height: 120px;
  }
  .column-header {
    position: sticky;
    top: 0;
    background: var(--header-bg);
    border-radius: 10px 10px 0 0;
    padding: 10px 12px 8px;
    font-weight: 700;
    font-size: 0.95rem;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid var(--card-border);
  }
  .column-header .count {
    font-weight: 500;
    font-size: 0.75rem;
    color: var(--muted);
  }
  .column-list {
    overflow-y: auto;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .chip {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 0.78rem;
    line-height: 1.3;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .chip .badge {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    border-radius: 5px;
    font-size: 0.65rem;
    font-weight: 700;
    color: #fff;
  }
  .badge.another { background: var(--badge-another); }
  .badge.hyper { background: var(--badge-hyper); }
  .badge.leggendaria { background: var(--badge-leggendaria); }
  .chip .title {
    overflow-wrap: anywhere;
  }
  .column-list::-webkit-scrollbar {
    width: 6px;
  }
  .column-list::-webkit-scrollbar-thumb {
    background: var(--card-border);
    border-radius: 3px;
  }
</style>
</head>
<body>
  <header class="page-header">
    <h1>beatmania IIDX ☆12 難易度表</h1>
    <p class="subtitle">地力 / 個人差 タイル × クリアランプ基準（ノーマル / ハード）で分類</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-mode="nomal">ノーマルクリア基準</button>
    <button class="tab-btn" data-mode="hard">ハードクリア基準</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

<script id="chart-data" type="application/json">__CHART_DATA__</script>
<script id="tier-order" type="application/json">__TIER_ORDER__</script>
<script>
  const DATA = JSON.parse(document.getElementById('chart-data').textContent);
  const TIERS = JSON.parse(document.getElementById('tier-order').textContent);

  const boardEl = document.getElementById('board');
  const statsEl = document.getElementById('stats');
  const tabBtns = document.querySelectorAll('.tab-btn');

  function render(mode) {
    const key = mode === 'hard' ? 'hard' : 'nomal';
    const byTier = new Map(TIERS.map(t => [t, []]));
    for (const entry of DATA) {
      const tier = entry[key];
      if (byTier.has(tier)) byTier.get(tier).push(entry);
    }

    boardEl.innerHTML = '';
    for (const tier of TIERS) {
      const list = byTier.get(tier) || [];
      const column = document.createElement('div');
      column.className = 'column';

      const header = document.createElement('div');
      header.className = 'column-header';
      header.innerHTML = `<span>${tier}</span><span class="count">${list.length}</span>`;
      column.appendChild(header);

      const listEl = document.createElement('div');
      listEl.className = 'column-list';
      for (const entry of list) {
        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.dataset.title = entry.title;
        chip.dataset.csv = entry.csv;
        chip.dataset.diff = entry.diff;
        chip.innerHTML = `<span class="badge ${entry.diff}">${entry.diffLabel}</span><span class="title">${entry.title}</span>`;
        listEl.appendChild(chip);
      }
      column.appendChild(listEl);
      boardEl.appendChild(column);
    }

    statsEl.textContent = `全 ${DATA.length} 譜面`;
  }

  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      tabBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render(btn.dataset.mode);
    });
  });

  render('nomal');
</script>
</body>
</html>
